<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="accent" x1="80" y1="80" x2="430" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D49A63"/>
      <stop offset="1" stop-color="#8E5A32"/>
    </linearGradient>
  </defs>

  <!-- Rounded terminal window -->
  <rect x="52" y="52" width="408" height="408" rx="92"
        fill="#111111" stroke="#2D2D2D" stroke-width="12"/>

  <!-- Terminal dots -->
  <circle cx="112" cy="124" r="10" fill="#D49A63"/>
  <circle cx="146" cy="124" r="10" fill="#A66D3F"/>
  <circle cx="180" cy="124" r="10" fill="#704727"/>

  <!-- Code brackets -->
  <path d="M190 196 L132 256 L190 316"
        stroke="url(#accent)" stroke-width="28"
        stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M322 196 L380 256 L322 316"
        stroke="url(#accent)" stroke-width="28"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Slash -->
  <path d="M292 178 L220 334"
        stroke="#F2F2F2" stroke-width="24"
        stroke-linecap="round"/>

  <!-- Small developer underline -->
  <path d="M156 374 H356"
        stroke="url(#accent)" stroke-width="10"
        stroke-linecap="round"/>
</svg>